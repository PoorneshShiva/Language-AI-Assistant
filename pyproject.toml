[project]
name = "lexilearn"
version = "0.1.0"
description = "The Language Learner AI Assistant is designed to be an effective and agentic learning tool for language students. Initially focused on German, the project aims to provide a personalized learning experience with the potential to scale to other languages in the future."
authors = [
    {name = "Poornesh Shiva", email = "info@poorneshshiva.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "fastapi>=0.115.12,<0.116.0",
    "uvicorn>=0.34.2,<0.35.0",
    "strawberry-graphql[fastapi]>=0.268.0",
    "pydantic>=2.7.1,<2.8.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.5",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2"
]
scripts = { lexilearn = "lexilearn.main:main" }

[tool.poetry]
packages = [
    {include = "lexilearn", from = "src"}
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"



